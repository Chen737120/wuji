# 舞记 iOS 云构建：GitHub 的 macOS 机器上产出未签名的 IPA 归档，
# 并在 iOS 模拟器上做启动冒烟（装机前的基本验证：不闪退 + 首屏渲染）。
# 使用方式：push master 自动触发，或仓库页 Actions → 手动运行 ios-build →
# 完成后在 Artifacts 下载 wuji-ios-unsigned-ipa / wuji-ios-smoke。
# 出正式安装包还需要 Apple 开发者账号签名（Xcode 打开归档 Distribute，
# 或用 Sideloadly/爱思助手以免费 Apple ID 签名装机）。
name: iOS build

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build IPA (no codesign)
        run: flutter build ipa --release --no-codesign

      # 未签名 IPA：可直接拖入 Sideloadly/爱思助手，用免费 Apple ID 签名后装机
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qry wuji-unsigned.ipa Payload

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: wuji-ios
          path: build/ios/archive/Runner.xcarchive

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: wuji-ios-unsigned-ipa
          path: build/ios/ipa/wuji-unsigned.ipa

  smoke:
    name: iOS simulator smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 模拟器构建（真机 IPA 装不进模拟器，需单独产出 sim 架构；
      # flutter 不支持 --release 模拟器构建，用默认 debug）
      - name: Build for simulator
        run: flutter build ios --simulator --no-codesign

      - name: Boot simulator and launch app
        run: |
          set -euo pipefail
          # 动态选一个可用的 iPhone 模拟器（runner 预装 runtime 会随 Xcode 版本变化）
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/^.*\(([A-F0-9-]+)\).*$/\1/')
          echo "Using simulator UDID: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          # launch 失败（权限 key 缺失等）直接 fail
          xcrun simctl launch "$DEVICE" com.danceapp.wuji
          sleep 15
          # 进程仍存活 = 没有启动即闪退。不能用 grep -q：命中即退出，
          # launchctl 还在写会吃 SIGPIPE，pipefail 下误报 App died
          # （2026-10-12 实踩：app 正常启动 PID 10350 仍被判失败）
          xcrun simctl spawn "$DEVICE" launchctl list | grep com.danceapp.wuji \
            || { echo "App process died within 15s"; exit 1; }
          xcrun simctl io "$DEVICE" screenshot wuji-smoke-1.png
          sleep 3
          xcrun simctl io "$DEVICE" screenshot wuji-smoke-2.png
          xcrun simctl terminate "$DEVICE" com.danceapp.wuji || true
          xcrun simctl shutdown "$DEVICE" || true

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wuji-ios-smoke
          path: wuji-smoke-*.png

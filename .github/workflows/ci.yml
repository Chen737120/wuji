name: android-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # 固定与本地一致的版本：stable 最新已把 package:flutter/material.dart
        # 标记 deprecated（after 3.47.0-0.0.pre），analyze 报 67 条 info 致 CI 失败
        #（2026-11-14 分支轮实证，任务书 R8 同源）；3.47.6 下 analyze 0。
        with: { channel: stable, flutter-version: 3.47.6 }
      - run: flutter pub get
      - run: flutter analyze lib/ test/
      - run: flutter test
